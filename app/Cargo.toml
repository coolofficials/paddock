[package]
name = "paddock"
version = "1.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/coolofficials/paddock"
rust-version = "1.90"

[dependencies]
wry = { version = "0.57.3", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6.2"
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
pdf-extract = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
